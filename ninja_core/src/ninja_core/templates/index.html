<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NinjaRobot V4 Control Panel</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Preload fonts if possible, or use system fonts as fallback -->
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="/static/logo.png" alt="NinjaRobot Logo" class="logo-img">
            <h1>Ninja Robot V4.0</h1>
        </div>
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span>Online</span>
        </div>
    </header>

    <div id="app">
        <!-- Sensor Data (Top Priority) -->
        <div class="control-section" id="sensor-controls">
            <h2>Distance Sensor</h2>
            <div id="distance-display">- mm</div>
        </div>

        <!-- Servo Controls -->
        <div class="control-section" id="servo-controls">
            <h2>Servo Movements</h2>
            <div class="control-group">
                <select id="movements-select"></select>
                <button id="execute-movement-btn">Execute</button>
            </div>
        </div>

        <!-- Facial Expressions -->
        <div class="control-section" id="display-controls">
            <h2>Facial Expressions</h2>
            <div class="control-group">
                <select id="expressions-select"></select>
                <button id="show-expression-btn">Show</button>
            </div>
        </div>

        <!-- Sound Controls -->
        <div class="control-section" id="sound-controls">
            <h2>Emotion Sounds</h2>
            <div class="control-group">
                <select id="emotions-select"></select>
                <button id="play-emotion-btn">Play</button>
            </div>
        </div>

        <!-- AI Agent (Spans full width on mobile, larger on desktop) -->
        <div class="control-section" id="agent-controls" style="grid-column: 1 / -1;">
            <h2>Ninja AI Agent</h2>
            <button id="set-api-key-btn">Set/Update AI API Key</button>

            <div id="chat-container" style="display: none;">
                <div id="chat-history"></div>
                <div id="chat-input-container">
                    <input type="text" id="chat-input" placeholder="Ask the robot to do something...">

                    <div class="chat-controls-row">
                        <select id="lang-select">
                            <option value="en-US">English</option>
                            <option value="ja-JP">日本語</option>
                            <option value="zh-TW">繁體中文</option>
                            <option value="zh-CN">简体中文</option>
                        </select>
                        <button id="chat-send-btn">Send</button>
                    </div>

                    <button id="micButton" title="Start Voice Input">
                        <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.66 9 5v6c0 1.66 1.34 3 3 3z" />
                            <path
                                d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- System Log -->
        <div class="control-section" id="log-controls" style="display: none; grid-column: 1 / -1;">
            <h2>System Log</h2>
            <pre id="system-log"></pre>
        </div>

        <!-- System Controls -->
        <div class="control-section" id="system-controls">
            <h2>System Controls</h2>
            <div class="slider-container" id="power-off-slider">
                <div class="slider-track">
                    <span class="slider-text">Slide to Power Off</span>
                </div>
                <div class="slider-thumb" id="slider-thumb">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="#FF3B30">
                        <path
                            d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/main.js"></script>
</body>

</html>
